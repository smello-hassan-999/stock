<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المخزن">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>مخزن Smello</title>
<style>
:root{--bg:#111;--card:#1c1c1e;--line:#2c2c2e;--tx:#f2f2f2;--mut:#9a9a9f;--gold:#d4af37;--red:#ff6b6b;--grn:#4cd964}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Arabic",Tahoma,sans-serif;padding-bottom:110px}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;font-size:20px;font-weight:700;color:var(--gold)}
main{padding:0 14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px}
.big{font-size:30px;font-weight:700}.mut{color:var(--mut);font-size:13px}.grn{color:var(--grn)}.red{color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid var(--line);background:#000;color:var(--tx)}
button{font-size:17px;border:0;border-radius:10px;padding:12px 16px;background:var(--gold);color:#000;font-weight:700;width:100%;margin-top:12px}
button.sec{background:var(--line);color:var(--tx)}button.sm{width:auto;padding:6px 10px;font-size:14px;margin:0;background:var(--line);color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border:0}
nav{position:sticky;top:0;z-index:5;display:flex;background:#111111ee;backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);margin-bottom:12px}
nav a{flex:1;text-align:center;padding:8px 0 8px;font-size:12px;color:var(--mut)}nav a b{display:block;font-size:20px}
nav a.on{color:var(--gold)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{margin:0;padding:8px;font-size:14px;background:var(--line);color:var(--tx)}.tabs button.on{background:var(--gold);color:#000}
.low{color:var(--red)}.warn{margin-top:8px;font-size:13px;color:#ffcc66;line-height:1.5}.priv{font-size:13px;color:#ffcc66;line-height:1.6;margin:8px 0}
</style></head><body>
<header id="ttl"></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const K='smello_stock_v1';
const def={products:[],restocks:[],sales:[],losses:[],ship:[],lastBackup:null};
let D=JSON.parse(localStorage.getItem(K)||'null')||JSON.parse(JSON.stringify(def));
const save=()=>localStorage.setItem(K,JSON.stringify(D));
const $=s=>document.querySelector(s);
const n=v=>Number(v)||0;
const uv=v=>(v===null||v===undefined||String(v).trim()==='')?null:Number(v);
const f=v=>Math.round(v*100)/100;
const fm=v=>f(v).toLocaleString('en-US');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const P=id=>D.products.find(p=>p.id===id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stock(id){let q=0;D.restocks.forEach(r=>r.pid===id&&(q+=n(r.q)));D.sales.forEach(s=>s.pid===id&&(q-=n(s.q)));D.losses.forEach(l=>l.pid===id&&(q-=n(l.q)));return q}
function stats(from,to){
 const inR=d=>(!from||d>=from)&&(!to||d<=to);
 let rev=0,cogs=0,shipCost=0,shipIn=0,loss=0,cnt=0,unk=0;
 const u=v=>v===null||v===undefined||v==='';
 D.sales.filter(s=>inR(s.d)).forEach(s=>{rev+=n(s.price)*n(s.q);cogs+=n(s.cost)*n(s.q);shipCost+=n(s.shipCost);shipIn+=n(s.shipIn);cnt+=n(s.q);if(u(s.cost)||u(s.shipCost)||u(s.shipIn))unk++});
 D.losses.filter(l=>inR(l.d)).forEach(l=>{loss+=n(l.cost)*n(l.q);if(u(l.cost))unk++});
 return{rev,cogs,shipCost,shipIn,loss,cnt,unk,profit:rev+shipIn-cogs-shipCost-loss}
}
const tabs=[['home','الرئيسية','📊'],['sales','مبيعات','🛒'],['stock','المخزن','📦'],['more','المزيد','⚙️']];
let tab='home',sub={stock:'list',more:'ship'},range='month';
function nav(){$('#nav').innerHTML=tabs.map(t=>`<a class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[2]}</b>${t[1]}</a>`).join('')}
function go(t){tab=t;render();scrollTo(0,0)}
function rng(){const t=today();if(range==='day')return[t,t];if(range==='month')return[t.slice(0,8)+'01',t];if(range==='year')return[t.slice(0,5)+'01-01',t];return[null,null]}
function render(){nav();$('#ttl').textContent={home:'ملخص الأرباح',sales:'المبيعات',stock:'المخزن',more:'الشحن والنسخ الاحتياطي'}[tab];$('#app').innerHTML=V[tab]()}
const V={
home(){const[a,b]=rng();const s=stats(a,b);
 const low=D.products.filter(p=>stock(p.id)<=n(p.min||3));
 const val=D.products.reduce((t,p)=>t+stock(p.id)*n(p.cost),0),valU=D.products.some(p=>(p.cost===null||p.cost===undefined)&&stock(p.id)>0);
 return `<div class="tabs">${[['day','اليوم'],['month','الشهر'],['year','السنة'],['all','الكل']].map(r=>`<button class="${range===r[0]?'on':''}" onclick="range='${r[0]}';render()">${r[1]}</button>`).join('')}</div>
 <div class="card"><div class="mut">${s.unk?'ربح مبدئي (مش نهائي)':'صافي الربح'}</div><div class="big ${s.profit<0?'red':'grn'}">${fm(s.profit)} ج</div>${s.unk?`<div class="warn">⚠️ فيه ${s.unk} حركة ناقصة (تكلفة المنتج أو الشحن لسه مش معروفة). الرقم ده ممكن يكون أعلى من الحقيقي لحد ما تكمّلها.</div>`:''}</div>
 <div class="card"><div class="row"><span>المبيعات (${fm(s.cnt)} قطعة)</span><b>${fm(s.rev)}</b></div>
 <div class="row"><span>شحن محصّل من العملاء</span><b>${fm(s.shipIn)}</b></div>
 <div class="row"><span>تكلفة البضاعة المباعة</span><b>- ${fm(s.cogs)}</b></div>
 <div class="row"><span>مصاريف الشحن</span><b>- ${fm(s.shipCost)}</b></div>
 <div class="row"><span>الهوالك</span><b>- ${fm(s.loss)}</b></div></div>
 <div class="card"><div class="row"><span>قيمة المخزن الحالي (بسعر التكلفة)${valU?' ⚠️ ناقصة':''}</span><b>${fm(val)}</b></div></div>
 ${low.length?`<div class="card"><b class="low">قارب على الخلاص</b>${low.map(p=>`<div class="row"><span>${esc(p.name)}</span><b class="low">${stock(p.id)}</b></div>`).join('')}</div>`:''}`},
sales(){
 if(!D.products.length)return`<div class="card">ضيف منتجات الأول من تبويب المخزن.</div>`;
 const opts=D.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${stock(p.id)})</option>`).join('');
 const sh=D.ship.map((s,i)=>`<option value="${i}">${esc(s.n)} - ${s.p}</option>`).join('');
 const list=[...D.sales].reverse().slice(0,40).map(s=>`<div class="row"><span>${esc(s.d)}<br>${esc(P(s.pid)?.name||'؟')} × ${s.q}${s.cust?'<br><span class=mut>'+esc(s.cust)+'</span>':''}</span><span>${fm(s.price*s.q)} <button class="sm" onclick="del('sales','${s.id}')">حذف</button></span></div>`).join('')||'<div class="mut">مفيش مبيعات لسه</div>';
 return `<div class="card"><label>المنتج</label><select id="sp" onchange="fillP()">${opts}</select>
 <div class="grid"><div><label>الكمية</label><input id="sq" type="number" inputmode="numeric" value="1"></div><div><label>سعر البيع للقطعة</label><input id="spr" type="number" inputmode="decimal"></div></div>
 ${D.ship.length?`<label>أسعار الشحن المحفوظة</label><select id="ss" onchange="fillS()"><option value="-1">-- اختار (اختياري) --</option>${sh}</select>`:''}
 <div class="grid"><div><label>تكلفة الشحن علينا</label><input id="sc" type="number" inputmode="decimal" placeholder="مش معروف"></div><div><label>شحن محصّل من العميل</label><input id="si" type="number" inputmode="decimal" placeholder="مش معروف"></div></div>
 <div class="mut">سيبه فاضي لو مش عارفه (الربح هيتعلّم إنه مبدئي). اكتب 0 لو مفيش شحن فعلاً.</div>
 <label>اسم العميل (اختياري)</label><input id="scu"><label>التاريخ</label><input id="sd" type="date" value="${today()}">
 <button onclick="addSale()">تسجيل البيعة</button></div><div class="card"><b>آخر المبيعات</b>${list}</div>`},
stock(){
 const t=['list','add','loss','new'];const nm={list:'الأرصدة',add:'توريد',loss:'هوالك',new:'منتج جديد'};
 let h=`<div class="tabs">${t.map(x=>`<button class="${sub.stock===x?'on':''}" onclick="sub.stock='${x}';render()">${nm[x]}</button>`).join('')}</div>`;
 const opts=D.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
 if(sub.stock==='list')h+=`<div class="card">${D.products.map(p=>{const q=stock(p.id);return`<div class="row"><span>${esc(p.name)}<br><span class="mut">تكلفة ${p.cost===null||p.cost===undefined?'⚠️ مش معروفة':fm(p.cost)} | بيع ${fm(p.price)}</span></span><span><b class="${q<=n(p.min||3)?'low':''}">${q}</b> <button class="sm" onclick="delP('${p.id}')">حذف</button></span></div>`}).join('')||'<div class="mut">مفيش منتجات. اضغط "منتج جديد".</div>'}</div>`;
 if(sub.stock==='new')h+=`<div class="card"><label>اسم المنتج</label><input id="pn"><div class="grid"><div><label>سعر التكلفة (اتركه فاضي لو مش معروف)</label><input id="pc" type="number" inputmode="decimal"></div><div><label>سعر البيع</label><input id="pp" type="number" inputmode="decimal"></div></div><label>الكمية الحالية</label><input id="pq" type="number" inputmode="numeric" value="0"><label>تنبيه لما يقل عن</label><input id="pm" type="number" inputmode="numeric" value="3"><button onclick="addP()">حفظ المنتج</button></div>`;
 if(sub.stock==='add')h+=D.products.length?`<div class="card"><label>المنتج</label><select id="rp" onchange="fillR()">${opts}</select><div class="grid"><div><label>الكمية</label><input id="rq" type="number" inputmode="numeric"></div><div><label>تكلفة القطعة</label><input id="rc" type="number" inputmode="decimal"></div></div><label>التاريخ</label><input id="rd" type="date" value="${today()}"><button onclick="addR()">تسجيل التوريد</button></div>
 <div class="card"><b>آخر التوريدات</b>${[...D.restocks].reverse().slice(0,20).map(r=>`<div class="row"><span>${esc(r.d)} ${esc(P(r.pid)?.name||'؟')}</span><span>+${r.q} <button class="sm" onclick="del('restocks','${r.id}')">حذف</button></span></div>`).join('')}</div>`:'<div class="card">ضيف منتج الأول.</div>';
 if(sub.stock==='loss')h+=D.products.length?`<div class="card"><label>المنتج</label><select id="lp">${opts}</select><label>الكمية</label><input id="lq" type="number" inputmode="numeric" value="1"><label>السبب</label><input id="lr" placeholder="كسر / تالف / عينة"><label>التاريخ</label><input id="ld" type="date" value="${today()}"><button onclick="addL()">تسجيل هالك</button></div>
 <div class="card"><b>آخر الهوالك</b>${[...D.losses].reverse().slice(0,20).map(l=>`<div class="row"><span>${esc(l.d)} ${esc(P(l.pid)?.name||'؟')}<br><span class="mut">${esc(l.r)}</span></span><span>-${l.q} <button class="sm" onclick="del('losses','${l.id}')">حذف</button></span></div>`).join('')}</div>`:'<div class="card">ضيف منتج الأول.</div>';
 return h},
more(){return `<div class="card"><b>أسعار الشحن</b>${D.ship.map((s,i)=>`<div class="row"><span>${esc(s.n)}</span><span>${s.p} <button class="sm" onclick="D.ship.splice(${i},1);save();render()">حذف</button></span></div>`).join('')}
 <label>اسم المنطقة</label><input id="shn"><label>السعر</label><input id="shp" type="number" inputmode="decimal"><button onclick="addShip()">إضافة سعر شحن</button></div>
 <div class="card"><b>نسخة احتياطية</b><div class="priv">🔒 النسخة فيها كل اللي كتبته، حتى أسماء العملاء. احفظها كملف خاص (في تطبيق الملفات أو iCloud Drive) ومتبعتهاش في شات ولا لحد.</div><div class="mut">آخر نسخة: ${D.lastBackup?esc(D.lastBackup):'لسه ما اتعملتش'}</div><button onclick="exp()">حفظ نسخة احتياطية (ملف)</button><label>استرجاع من ملف</label><input id="imp" type="file" accept=".json,application/json" onchange="imp(this)"></div></div>`}
};
function fillP(){const p=P($('#sp').value);if(p)$('#spr').value=p.price}
function fillS(){const i=n($('#ss').value);const s=D.ship[i];if(s)$('#sc').value=s.p}
function fillR(){const p=P($('#rp').value);if(p)$('#rc').value=p.cost??''}
function addSale(){const pid=$('#sp').value,q=n($('#sq').value);if(!pid||q<=0)return alert('اكتب الكمية');
 const p=P(pid);if(q>stock(pid)&&!confirm('الكمية أكبر من الرصيد ('+stock(pid)+'). تكمل؟'))return;
 D.sales.push({id:uid(),d:$('#sd').value||today(),pid,q,price:n($('#spr').value||p.price),cost:uv(p.cost),shipCost:uv($('#sc').value),shipIn:uv($('#si').value),cust:$('#scu').value});save();render()}
function addP(){const name=$('#pn').value.trim();if(!name)return alert('اكتب الاسم');const id=uid();
 D.products.push({id,name,cost:uv($('#pc').value),price:n($('#pp').value),min:n($('#pm').value)});
 if(n($('#pq').value)>0)D.restocks.push({id:uid(),d:today(),pid:id,q:n($('#pq').value),cost:uv($('#pc').value)});
 sub.stock='list';save();render()}
function addR(){const pid=$('#rp').value,q=n($('#rq').value);if(q<=0)return alert('اكتب الكمية');const c=uv($('#rc').value);
 D.restocks.push({id:uid(),d:$('#rd').value||today(),pid,q,cost:c});
 const p=P(pid);if(c!==null&&c>0&&c!==p.cost&&confirm('تحدّث سعر تكلفة المنتج إلى '+c+'؟'))p.cost=c;save();render()}
function addL(){const pid=$('#lp').value,q=n($('#lq').value);if(q<=0)return;D.losses.push({id:uid(),d:$('#ld').value||today(),pid,q,r:$('#lr').value,cost:uv(P(pid).cost)});save();render()}
function addShip(){const nn=$('#shn').value.trim();if(!nn)return;D.ship.push({n:nn,p:n($('#shp').value)});save();render()}
function del(k,id){if(!confirm('متأكد؟'))return;D[k]=D[k].filter(x=>x.id!==id);save();render()}
function delP(id){if(!confirm('حذف المنتج وكل حركاته؟'))return;D.products=D.products.filter(p=>p.id!==id);['restocks','sales','losses'].forEach(k=>D[k]=D[k].filter(x=>x.pid!==id));save();render()}
async function exp(){const name='smello-stock-'+today()+'.json';const blob=new Blob([JSON.stringify(D)],{type:'application/json'});
 const file=new File([blob],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});D.lastBackup=today();save();render();return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();D.lastBackup=today();save();render()}
function imp(el){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.products)throw 0;if(confirm('هيستبدل البيانات الحالية. تكمل؟')){D=x;save();render()}}catch(e){alert('الملف غير صالح')}};r.readAsText(el.files[0])}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();
</script></body></html>
