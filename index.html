<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المخزن">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg">
<title>مخزن Smello</title>
<style>
:root{--bg:#111;--card:#1c1c1e;--line:#2c2c2e;--tx:#f2f2f2;--mut:#9a9a9f;--gold:#d4af37;--red:#ff6b6b;--grn:#4cd964}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,"SF Arabic",Tahoma,sans-serif;padding-bottom:110px}
header{padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;font-size:20px;font-weight:700;color:var(--gold)}
main{padding:0 14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:0 0 12px}
.big{font-size:30px;font-weight:700}.mut{color:var(--mut);font-size:13px}.grn{color:var(--grn)}.red{color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;font-size:17px;border-radius:10px;border:1px solid var(--line);background:#000;color:var(--tx)}
button{font-size:17px;border:0;border-radius:10px;padding:12px 16px;background:var(--gold);color:#000;font-weight:700;width:100%;margin-top:12px}
button.sec{background:var(--line);color:var(--tx)}button.sm{width:auto;padding:6px 10px;font-size:14px;margin:0;background:var(--line);color:var(--red)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.row:last-child{border:0}
nav{position:sticky;top:0;z-index:5;display:flex;background:#111111ee;backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top);margin-bottom:12px}
nav a{flex:1;text-align:center;padding:8px 0 8px;font-size:12px;color:var(--mut)}nav a b{display:block;font-size:20px}
nav a.on{color:var(--gold)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{margin:0;padding:8px;font-size:14px;background:var(--line);color:var(--tx)}.tabs button.on{background:var(--gold);color:#000}
.low{color:var(--red)}.warn{margin-top:8px;font-size:13px;color:#ffcc66;line-height:1.5}.priv{font-size:13px;color:#ffcc66;line-height:1.6;margin:8px 0}
</style></head><body>
<header id="ttl"></header>
<nav id="nav"></nav><main id="app"></main>
<script>
const K='smello_stock_v1';
const def={products:[],restocks:[],sales:[],losses:[],ship:[],expenses:[],lastBackup:null};
let D=JSON.parse(localStorage.getItem(K)||'null')||JSON.parse(JSON.stringify(def));
D.expenses=D.expenses||[];
const save=()=>localStorage.setItem(K,JSON.stringify(D));
const $=s=>document.querySelector(s);
const n=v=>Number(v)||0;
const uv=v=>(v===null||v===undefined||String(v).trim()==='')?null:Number(v);
const f=v=>Math.round(v*100)/100;
const fm=v=>f(v).toLocaleString('en-US');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const P=id=>D.products.find(p=>p.id===id);
const pname=p=>p?('\u2068'+p.name+'\u2069'+(p.size?' \u00b7 \u2068'+p.size+'\u2069':'')):'؟';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function stock(id){let q=0;D.restocks.forEach(r=>r.pid===id&&(q+=n(r.q)));D.sales.forEach(s=>s.pid===id&&(q-=n(s.q)));D.losses.forEach(l=>l.pid===id&&(q-=n(l.q)));return q}
function stats(from,to){
 const inR=d=>(!from||d>=from)&&(!to||d<=to);
 let rev=0,cogs=0,shipCost=0,shipIn=0,loss=0,cnt=0,unk=0,exp=0;
 const u=v=>v===null||v===undefined||v==='';
 D.sales.filter(s=>inR(s.d)).forEach(s=>{rev+=n(s.price)*n(s.q);cogs+=n(s.cost)*n(s.q);shipCost+=n(s.shipCost);shipIn+=n(s.shipIn);cnt+=n(s.q);if(u(s.cost))unk++});
 D.losses.filter(l=>inR(l.d)).forEach(l=>{loss+=n(l.cost)*n(l.q);if(u(l.cost))unk++});
 D.expenses.filter(e=>inR(e.d)).forEach(e=>{exp+=n(e.amt)});
 return{rev,cogs,shipCost,shipIn,loss,cnt,unk,exp,profit:rev+shipIn-cogs-shipCost-loss-exp}
}
const tabs=[['home','الرئيسية','📊'],['sales','مبيعات','🛒'],['stock','المخزن','📦'],['exp','مصروفات','💸'],['more','المزيد','⚙️']];
let tab='home',sub={stock:'list',more:'ship'},range='month';
function nav(){$('#nav').innerHTML=tabs.map(t=>`<a class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><b>${t[2]}</b>${t[1]}</a>`).join('')}
function go(t){tab=t;render();scrollTo(0,0)}
function rng(){const t=today();if(range==='day')return[t,t];if(range==='month')return[t.slice(0,8)+'01',t];if(range==='year')return[t.slice(0,5)+'01-01',t];return[null,null]}
function render(){if(ML[0]&&!ML[0].pid&&D.products.length)ML[0].pid=D.products[0].id;if(OL[0]&&!OL[0].pid&&D.products.length){OL[0].pid=D.products[0].id;OL[0].price=D.products[0].price}nav();$('#ttl').textContent={home:'ملخص الأرباح',sales:'المبيعات',stock:'المخزن',exp:'المصروفات العامة',more:'الشحن والنسخ الاحتياطي'}[tab];$('#app').innerHTML=V[tab]()}
let ML=[{pid:null,q:'',c:''}],MS={ship:'',mode:'q'};
let OL=[{pid:null,q:'1',price:''}],OS={cust:'',d:''};
function olSel(i,id){OL[i].pid=id;OL[i].price=P(id).price;render()}
const V={
home(){const[a,b]=rng();const s=stats(a,b);
 const low=D.products.filter(p=>stock(p.id)<=n(p.min||3));
 const val=D.products.reduce((t,p)=>t+stock(p.id)*n(p.cost),0),valU=D.products.some(p=>(p.cost===null||p.cost===undefined)&&stock(p.id)>0);
 return `<div class="tabs">${[['day','اليوم'],['month','الشهر'],['year','السنة'],['all','الكل']].map(r=>`<button class="${range===r[0]?'on':''}" onclick="range='${r[0]}';render()">${r[1]}</button>`).join('')}</div>
 <div class="card"><div class="mut">${s.unk?'ربح مبدئي (مش نهائي)':'صافي الربح'}</div><div class="big ${s.profit<0?'red':'grn'}">${fm(s.profit)} ج</div>${s.unk?`<div class="warn">⚠️ فيه ${s.unk} حركة ناقصة (تكلفة المنتج لسه مش معروفة). الرقم ده ممكن يكون أعلى من الحقيقي لحد ما تكمّلها.</div>`:''}</div>
 <div class="card"><div class="row"><span>المبيعات (${fm(s.cnt)} قطعة)</span><b>${fm(s.rev)}</b></div>
 <div class="row"><span>شحن محصّل من العملاء</span><b>${fm(s.shipIn)}</b></div>
 <div class="row"><span>تكلفة البضاعة المباعة</span><b>- ${fm(s.cogs)}</b></div>
 <div class="row"><span>مصاريف الشحن</span><b>- ${fm(s.shipCost)}</b></div>
 <div class="row"><span>الهوالك</span><b>- ${fm(s.loss)}</b></div>
 <div class="row"><span>مصروفات عامة</span><b>- ${fm(s.exp)}</b></div></div>
 <div class="card"><div class="row"><span>قيمة المخزن الحالي (بسعر التكلفة)${valU?' ⚠️ ناقصة':''}</span><b>${fm(val)}</b></div></div>
 ${low.length?`<div class="card"><b class="low">قارب على الخلاص</b>${low.map(p=>`<div class="row"><span>${esc(pname(p))}</span><b class="low">${stock(p.id)}</b></div>`).join('')}</div>`:''}`},
sales(){
 if(!D.products.length)return`<div class="card">ضيف منتجات الأول من تبويب المخزن.</div>`;
 const sorted=[...D.products].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 const lines=OL.map((l,i)=>`<div class="card" style="background:#000;margin-top:10px"><label>الصنف / الحجم</label><select onchange="olSel(${i},this.value)">${sorted.map(p=>`<option value="${p.id}" ${l.pid===p.id?'selected':''}>${esc(pname(p))} (${stock(p.id)})</option>`).join('')}</select>
 <div class="grid"><div><label>الكمية</label><input type="number" inputmode="numeric" value="${l.q}" oninput="OL[${i}].q=this.value"></div><div><label>سعر البيع للقطعة</label><input type="number" inputmode="decimal" value="${l.price}" oninput="OL[${i}].price=this.value"></div></div>${OL.length>1?`<button class="sm" style="margin-top:8px" onclick="OL.splice(${i},1);render()">شيل الصنف</button>`:''}</div>`).join('');
 const groups={};const order=[];
 [...D.sales].reverse().forEach(s=>{const k=s.oid||s.id;if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(s)});
 const list=order.slice(0,40).map(k=>{const g=groups[k].slice().reverse();const tot=g.reduce((t,s)=>t+n(s.price)*n(s.q),0);const si=g.reduce((t,s)=>t+n(s.shipIn),0);const sc=g.reduce((t,s)=>t+n(s.shipCost),0);
  return `<div class="row"><span>${esc(g[0].d)}${g[0].cust?' <span class=mut>'+esc(g[0].cust)+'</span>':''}${g.map(s=>'<br>'+esc(pname(P(s.pid)))+' × '+s.q+' <span class=mut>@ '+fm(s.price)+'</span>').join('')}${(si||sc)?'<br><span class=mut>شحن محصّل '+fm(si)+' | تكلفة شحن '+fm(sc)+'</span>':''}</span><span>${fm(tot)} <button class="sm" onclick="delOrder('${k}')">حذف</button></span></div>`}).join('')||'<div class="mut">مفيش مبيعات لسه</div>';
 return `<div class="card"><b>طلب جديد</b><div class="mut">الطلب ممكن يكون فيه أكتر من صنف، أو أحجام مختلفة من نفس الصنف.</div>${lines}
 <button class="sec" onclick="OL.push({pid:D.products[0].id,q:'1',price:D.products[0].price});render()">+ صنف تاني في نفس الطلب</button>
 <label>اسم العميل (اختياري)</label><input value="${esc(OS.cust)}" oninput="OS.cust=this.value"><label>التاريخ</label><input type="date" value="${OS.d||today()}" oninput="OS.d=this.value">
 <button onclick="addOrder()">تسجيل الطلب</button></div><div class="card"><b>آخر الطلبات</b>${list}</div>`},
stock(){
 const t=['list','add','multi','loss','new'];const nm={list:'الأرصدة',add:'توريد',multi:'شحنة',loss:'هوالك',new:'منتج جديد'};
 let h=`<div class="tabs">${t.map(x=>`<button class="${sub.stock===x?'on':''}" onclick="sub.stock='${x}';render()">${nm[x]}</button>`).join('')}</div>`;
 const opts=D.products.map(p=>`<option value="${p.id}">${esc(pname(p))}</option>`).join('');
 if(sub.stock==='list')h+=`<div class="card">${D.products.map(p=>{const q=stock(p.id);return`<div class="row"><span>${esc(pname(p))}<br><span class="mut">تكلفة ${p.cost===null||p.cost===undefined?'⚠️ مش معروفة':fm(p.cost)} | بيع ${fm(p.price)}</span></span><span><b class="${q<=n(p.min||3)?'low':''}">${q}</b> <button class="sm" style="color:var(--tx)" onclick="editSize('${p.id}')">الحجم</button> <button class="sm" onclick="delP('${p.id}')">حذف</button></span></div>`}).join('')||'<div class="mut">مفيش منتجات. اضغط "منتج جديد".</div>'}</div>`;
 if(sub.stock==='new')h+=`<div class="card"><label>اسم المنتج</label><input id="pn"><label>الحجم (اختياري، مثلا 125 مل أو 220 مل)</label><input id="psz"><div class="grid"><div><label>سعر التكلفة (اتركه فاضي لو مش معروف)</label><input id="pc" type="number" inputmode="decimal"></div><div><label>سعر البيع</label><input id="pp" type="number" inputmode="decimal"></div></div><label>الكمية الحالية</label><input id="pq" type="number" inputmode="numeric" value="0"><label>تنبيه لما يقل عن</label><input id="pm" type="number" inputmode="numeric" value="3"><button onclick="addP()">حفظ المنتج</button></div>`;
 if(sub.stock==='add')h+=D.products.length?`<div class="card"><label>المنتج</label><select id="rp" onchange="fillR()">${opts}</select><div class="grid"><div><label>الكمية</label><input id="rq" type="number" inputmode="numeric"></div><div><label>تكلفة القطعة</label><input id="rc" type="number" inputmode="decimal"></div></div><label>التاريخ</label><input id="rd" type="date" value="${today()}"><button onclick="addR()">تسجيل التوريد</button></div>
 <div class="card"><b>آخر التوريدات</b>${[...D.restocks].reverse().slice(0,20).map(r=>`<div class="row"><span>${esc(r.d)} ${esc(pname(P(r.pid)))}</span><span>+${r.q} <button class="sm" onclick="del('restocks','${r.id}')">حذف</button></span></div>`).join('')}</div>`:'<div class="card">ضيف منتج الأول.</div>';

 if(sub.stock==='multi')h+=D.products.length?`<div class="card"><b>توريدة شحنة (أكتر من نوع)</b><div class="mut">اكتب كل نوع وكميته وتكلفة القطعة، وبعدين مصاريف الشحنة كلها مرة واحدة. التطبيق يوزعها على القطع ويضيفها على تكلفة كل قطعة.</div><div class="priv">⚠️ فاتورة شحن المورد تتسجل في مكان واحد بس: هنا (توزيع على القطع) أو في تاب المصروفات، مش الاتنين، عشان متتحسبش مرتين في الربح.</div>
 ${ML.map((m,i)=>`<div class="card" style="background:#000;margin-top:10px"><select onchange="ML[${i}].pid=this.value">${D.products.map(p=>`<option value="${p.id}" ${m.pid===p.id?'selected':''}>${esc(pname(p))}</option>`).join('')}</select><div class="grid"><div><label>الكمية</label><input type="number" inputmode="numeric" value="${m.q}" oninput="ML[${i}].q=this.value"></div><div><label>تكلفة القطعة</label><input type="number" inputmode="decimal" value="${m.c}" oninput="ML[${i}].c=this.value"></div></div>${ML.length>1?`<button class="sm" style="margin-top:8px" onclick="ML.splice(${i},1);render()">شيل النوع</button>`:''}</div>`).join('')}
 <button class="sec" onclick="ML.push({pid:D.products[0].id,q:'',c:''});render()">+ نوع تاني</button>
 <label>مصاريف الشحنة كلها</label><input id="mship" type="number" inputmode="decimal" value="${MS.ship}" oninput="MS.ship=this.value">
 <label>التوزيع على</label><select id="mmode" onchange="MS.mode=this.value"><option value="q" ${MS.mode==='q'?'selected':''}>عدد القطع</option><option value="v" ${MS.mode==='v'?'selected':''}>قيمة كل نوع</option></select>
 <label>التاريخ</label><input id="mdate" type="date" value="${today()}">
 <button onclick="addMulti()">تسجيل الشحنة</button></div>`:'<div class="card">ضيف منتج الأول.</div>';
 if(sub.stock==='loss')h+=D.products.length?`<div class="card"><label>المنتج</label><select id="lp">${opts}</select><label>الكمية</label><input id="lq" type="number" inputmode="numeric" value="1"><label>السبب</label><input id="lr" placeholder="كسر / تالف / عينة"><label>التاريخ</label><input id="ld" type="date" value="${today()}"><button onclick="addL()">تسجيل هالك</button></div>
 <div class="card"><b>آخر الهوالك</b>${[...D.losses].reverse().slice(0,20).map(l=>`<div class="row"><span>${esc(l.d)} ${esc(pname(P(l.pid)))}<br><span class="mut">${esc(l.r)}</span></span><span>-${l.q} <button class="sm" onclick="del('losses','${l.id}')">حذف</button></span></div>`).join('')}</div>`:'<div class="card">ضيف منتج الأول.</div>';
 return h},
exp(){
 const[a,b]=rng();const tot=D.expenses.filter(e=>(!a||e.d>=a)&&(!b||e.d<=b)).reduce((t,e)=>t+n(e.amt),0);
 return `<div class="card"><div class="priv">⚠️ لو سجلت شحن المورد في "شحنة" (المخزن) متسجلوش هنا تاني. وسجله هنا بس لو عايز تخصمه كله دلوقتي من غير توزيع.</div><label>اسم المصروف</label><input id="en" placeholder="إعلانات / تغليف / مواصلات"><div class="grid"><div><label>المبلغ</label><input id="ea" type="number" inputmode="decimal"></div><div><label>التاريخ</label><input id="ed" type="date" value="${today()}"></div></div><label>ملاحظة (اختياري)</label><input id="eno"><button onclick="addE()">تسجيل المصروف</button></div>
 <div class="card"><div class="tabs">${[['day','اليوم'],['month','الشهر'],['year','السنة'],['all','الكل']].map(r=>`<button class="${range===r[0]?'on':''}" onclick="range='${r[0]}';render()">${r[1]}</button>`).join('')}</div><div class="row"><b>إجمالي المصروفات</b><b>${fm(tot)} ج</b></div>
 ${[...D.expenses].sort((x,y)=>y.d<x.d?-1:1).slice(0,60).map(e=>`<div class="row"><span>${esc(e.d)} ${esc(e.n)}${e.note?'<br><span class=mut>'+esc(e.note)+'</span>':''}</span><span>${fm(e.amt)} <button class="sm" onclick="del('expenses','${e.id}')">حذف</button></span></div>`).join('')||'<div class="mut">مفيش مصروفات لسه</div>'}</div>`},
more(){return `<div class="card"><b>أسعار الشحن</b>${D.ship.map((s,i)=>`<div class="row"><span>${esc(s.n)}</span><span>${s.p} <button class="sm" onclick="D.ship.splice(${i},1);save();render()">حذف</button></span></div>`).join('')}
 <label>اسم المنطقة</label><input id="shn"><label>السعر</label><input id="shp" type="number" inputmode="decimal"><button onclick="addShip()">إضافة سعر شحن</button></div>
 <div class="card"><b>نسخة احتياطية</b><div class="priv">🔒 النسخة فيها كل اللي كتبته، حتى أسماء العملاء. احفظها كملف خاص (في تطبيق الملفات أو iCloud Drive) ومتبعتهاش في شات ولا لحد.</div><div class="mut">آخر نسخة: ${D.lastBackup?esc(D.lastBackup):'لسه ما اتعملتش'}</div><button onclick="exp()">حفظ نسخة احتياطية (ملف)</button><label>استرجاع من ملف</label><input id="imp" type="file" accept=".json,application/json" onchange="imp(this)"></div></div>`}
};
function addE(){const nm=$('#en').value.trim(),amt=n($('#ea').value);if(!nm||amt<=0)return alert('اكتب الاسم والمبلغ');D.expenses.push({id:uid(),d:$('#ed').value||today(),n:nm,amt,note:$('#eno').value});save();render()}
function addMulti(){const rows=ML.filter(m=>m.pid&&n(m.q)>0);if(!rows.length)return alert('اكتب الكمية');
 const ship=n(MS.ship),d=$('#mdate').value||today();
 const w=m=>MS.mode==='v'?n(m.q)*n(m.c):n(m.q);const tw=rows.reduce((t,m)=>t+w(m),0);
 if(ship>0&&tw<=0)return alert('اكتب تكلفة القطع عشان التوزيع على القيمة');
 const out=rows.map(m=>{const share=ship>0?ship*w(m)/tw:0;const unit=uv(m.c)===null?null:f(n(m.c)+share/n(m.q));return{m,unit,share}});
 const msg=out.map(o=>pname(P(o.m.pid))+': '+(o.unit===null?'التكلفة مش معروفة':o.unit+' للقطعة (شحن '+f(o.share)+')')).join('\n');
 if(!confirm('هيتسجل:\n'+msg+'\nتكمل؟'))return;
 out.forEach(o=>{D.restocks.push({id:uid(),d,pid:o.m.pid,q:n(o.m.q),cost:o.unit});const p=P(o.m.pid);if(o.unit!==null&&o.unit>0&&o.unit!==p.cost&&confirm('تحدّث تكلفة '+pname(p)+' إلى '+o.unit+'؟'))p.cost=o.unit});
 ML=[{pid:D.products[0].id,q:'',c:''}];MS.ship='';save();render()}
function fillR(){const p=P($('#rp').value);if(p)$('#rc').value=p.cost??''}
function addOrder(){const rows=OL.filter(l=>l.pid&&n(l.q)>0);if(!rows.length)return alert('اكتب الكمية');
 const need={};rows.forEach(l=>need[l.pid]=(need[l.pid]||0)+n(l.q));
 for(const pid in need){if(need[pid]>stock(pid)&&!confirm('الكمية المطلوبة من '+pname(P(pid))+' ('+need[pid]+') أكبر من الرصيد ('+stock(pid)+'). تكمل؟'))return}
 const oid=uid(),d=OS.d||today();
 rows.forEach(l=>{const p=P(l.pid);D.sales.push({id:uid(),oid,d,pid:l.pid,q:n(l.q),price:n(l.price===''?p.price:l.price),cost:uv(p.cost),cust:OS.cust})});

async function exp(){const name='smello-stock-'+today()+'.json';const blob=new Blob([JSON.stringify(D)],{type:'application/json'});
 const file=new File([blob],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});D.lastBackup=today();save();render();return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();D.lastBackup=today();save();render()}
